[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulpnix"
version = "0.1.0"
description = "A Linux host risk assessment tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vulpnix = "vulpnix.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vulpnix.cli" = ["assets/*.png"]
